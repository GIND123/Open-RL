[project]
name = "premise-verify-eval"
version = "0.1.0"
description = "premise-verify-eval — does the model notice that a math word problem cannot be answered as stated?"
requires-python = ">=3.11"
dependencies = ["verifiers>=0.4.0,<0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premise_verify_eval"]
