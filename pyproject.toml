[project]
name = "premise-verify"
version = "0.1.0"
description = "Generator, SymPy verifier, and analysis for premise-verification evaluation under open RL."
requires-python = ">=3.11"
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["premise_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
